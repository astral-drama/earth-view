<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth View - Time Visualization</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #time-display {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 100;
            background: rgba(0,0,0,0.5);
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        #date-display {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: white;
            font-size: 20px;
            font-weight: normal;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            z-index: 100;
            background: rgba(0,0,0,0.5);
            padding: 10px 16px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        #controls-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border: 1px solid #555;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 18px;
            cursor: pointer;
            z-index: 101;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        #controls-toggle:hover {
            background: rgba(0, 0, 0, 0.9);
        }

        #controls {
            position: absolute;
            top: 20px;
            left: 70px;
            color: white;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            z-index: 100;
            transition: opacity 0.3s, transform 0.3s;
            max-width: 280px;
        }

        #controls.controls-hidden {
            opacity: 0;
            transform: translateX(-20px);
            pointer-events: none;
        }

        .control-group {
            margin-bottom: 10px;
        }

        label {
            display: inline-block;
            width: 120px;
            font-size: 14px;
        }

        input[type="range"] {
            width: 150px;
        }

        input[type="checkbox"] {
            margin-right: 5px;
        }

        .time-controls {
            border-top: 1px solid #555;
            padding-top: 10px;
            margin-top: 10px;
        }

        .time-controls h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #fff;
        }

        .control-subgroup {
            margin-bottom: 8px;
        }

        #manual-datetime {
            width: 160px;
            padding: 4px;
            border: 1px solid #555;
            border-radius: 4px;
            background: #333;
            color: #fff;
            font-size: 12px;
        }

        #manual-datetime:disabled {
            background: #222;
            color: #666;
        }

        .preset-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .preset-buttons button {
            padding: 4px 8px;
            border: 1px solid #555;
            border-radius: 4px;
            background: #444;
            color: #fff;
            font-size: 11px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .preset-buttons button:hover {
            background: #555;
        }

        .preset-buttons button:disabled {
            background: #222;
            color: #666;
            cursor: not-allowed;
        }

        #fps-counter {
            position: absolute;
            top: 20px;
            right: 20px;
            color: white;
            font-size: 14px;
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 4px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="time-display" data-testid="time-display">00:00:00</div>
    <div id="date-display" data-testid="date-display">Loading...</div>

    <button id="controls-toggle">⚙️</button>
    <div id="controls" class="controls-hidden">
        <div class="control-group">
            <label for="rotation-speed">Rotation Speed:</label>
            <input type="range" id="rotation-speed" min="0" max="2" step="0.1" value="0.5">
        </div>
        <div class="control-group">
            <label for="zoom-level">Zoom Level:</label>
            <input type="range" id="zoom-level" min="1.5" max="10" step="0.1" value="3">
        </div>
        <div class="control-group">
            <label>
                <input type="checkbox" id="atmosphere" checked> Atmosphere
            </label>
        </div>
        <div class="control-group">
            <label>
                <input type="checkbox" id="clouds" checked> Clouds
            </label>
        </div>
        <div class="control-group">
            <label>Cloud Opacity:</label>
            <input type="range" id="cloud-opacity" min="0" max="1" step="0.1" value="0.7">
        </div>
        <div class="control-group">
            <label>
                <input type="checkbox" id="night-lights" checked> Night Lights
            </label>
        </div>

        <!-- Time Controls -->
        <div class="control-group time-controls">
            <h3>Time Controls</h3>
            <div class="control-subgroup">
                <label>
                    <input type="checkbox" id="real-time-mode" checked> Real-time Mode
                </label>
            </div>
            <div class="control-subgroup">
                <label>Date & Time:</label>
                <input type="datetime-local" id="manual-datetime" disabled>
            </div>
            <div class="control-subgroup preset-buttons">
                <button id="summer-solstice">Summer Solstice</button>
                <button id="autumn-equinox">Autumn Equinox</button>
                <button id="winter-solstice">Winter Solstice</button>
                <button id="spring-equinox">Spring Equinox</button>
            </div>
        </div>
    </div>

    <div id="fps-counter">FPS: --</div>

    <canvas id="canvas"></canvas>

    <script src="gl-matrix-min.js"></script>
    <script src="earth-renderer.js"></script>
    <script src="main.js"></script>
</body>
</html>
